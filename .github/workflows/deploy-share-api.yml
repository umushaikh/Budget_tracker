# Deploys the live-share server to your own Cloudflare account, from a button
# on github.com. This exists so the whole thing can be done from a phone: the
# heavy lifting happens on a GitHub runner, not on your device.
#
# One-time setup (all in a browser):
#   1. Make a free Cloudflare account.
#   2. Create an API token with Workers Scripts:Edit and D1:Edit.
#   3. In this repo: Settings -> Secrets and variables -> Actions, add
#      CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#   4. Actions -> "Deploy share server" -> Run workflow.
name: Deploy share server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: budget-tracker-share

    steps:
      - uses: actions/checkout@v4

      # wrangler 4.x refuses to run on anything older than Node 22 - it
      # prints a warning and exits 1 rather than actually failing loudly, so
      # this silently breaks every step after it if left too low.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the secrets are set
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. It is the Account ID shown on your Cloudflare Workers & Pages page."
            missing=1
          fi
          [ "$missing" = 0 ]

      # A secret pasted from a phone keyboard easily picks up a trailing
      # newline or space that is invisible in the GitHub secret field - strip
      # all whitespace from both, everywhere in the string, and re-mask the
      # results since a trimmed value no longer matches the original secret.
      - name: Normalize the secrets
        run: |
          CLEAN_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLEAN_ACCOUNT="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          echo "::add-mask::$CLEAN_TOKEN"
          echo "::add-mask::$CLEAN_ACCOUNT"
          echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$CLEAN_ACCOUNT" >> "$GITHUB_ENV"
          if [ "$CLEAN_ACCOUNT" != "$CLOUDFLARE_ACCOUNT_ID" ] || [ "$CLEAN_TOKEN" != "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::One of the Cloudflare secrets had stray whitespace in it (likely from a copy-paste) - it has been trimmed automatically for this run. Worth re-pasting the secret cleanly next time, but nothing to do now."
          fi

      - name: Install wrangler
        run: npm ci

      - name: Check the token can do what the deploy needs
        run: python3 scripts/cf-preflight.py

      - name: Create the database if it does not exist yet
        run: |
          if npx wrangler d1 list --json | grep -q "\"name\": *\"$DB_NAME\""; then
            echo "Database $DB_NAME already exists, leaving it alone."
          else
            echo "Creating database $DB_NAME"
            npx wrangler d1 create "$DB_NAME"
          fi

      - name: Point the config at the database
        run: |
          DB_ID="$(npx wrangler d1 list --json | python3 scripts/d1-id.py "$DB_NAME")"
          if [ -z "$DB_ID" ]; then
            echo "::error::Could not read the database id back from Cloudflare."
            exit 1
          fi
          echo "Using database_id $DB_ID"
          sed -i "s|database_id = \"[^\"]*\"|database_id = \"$DB_ID\"|" api/wrangler.toml
          grep database_id api/wrangler.toml

      - name: Create the tables
        run: npx wrangler d1 execute "$DB_NAME" --remote --config api/wrangler.toml --file=api/schema.sql -y

      # A brand-new Cloudflare account has no workers.dev subdomain yet, and
      # wrangler needs one to publish a Worker with no custom domain
      # configured. A CI runner has nobody to answer that prompt, so pick one
      # via the API - a one-time thing per account, every future deploy skips
      # this step.
      - name: Register a workers.dev subdomain if this account needs one
        run: |
          existing="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          have_one="$(echo "$existing" | python3 -c "import sys,json; d=json.load(sys.stdin); print('yes' if (d.get('result') or {}).get('subdomain') else 'no')" 2>/dev/null || echo no)"
          if [ "$have_one" = "yes" ]; then
            echo "This account already has a workers.dev subdomain."
            exit 0
          fi

          CANDIDATE="budget-tracker-${CLOUDFLARE_ACCOUNT_ID:0:12}"
          echo "Registering workers.dev subdomain: $CANDIDATE"
          result="$(curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d "{\"subdomain\":\"$CANDIDATE\"}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          ok="$(echo "$result" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success'))" 2>/dev/null || echo False)"
          if [ "$ok" != "True" ]; then
            echo "$result"
            echo "::warning::Could not register a workers.dev subdomain automatically. This is a one-time step Cloudflare normally asks for on your first Worker: open https://dash.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/workers/onboarding, pick any name, tap Continue, then re-run this workflow. You will not need to do this again."
          fi

      # pipefail matters here: piping through tee to also save the log means
      # the step's exit code is tee's by default, which is always 0 - so a
      # failed wrangler deploy would otherwise be reported as a success.
      - name: Deploy the Worker
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy --config api/wrangler.toml 2>&1 | tee deploy.log
          URL="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Show the address to paste into the app
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          {
            echo "## Your share server is live"
            echo
            if [ -n "$URL" ]; then
              echo '```'
              echo "$URL"
              echo '```'
              echo
              echo "Copy that address, open the app, go to **Share**, paste it in,"
              echo "and tap **Turn on live sharing**."
            else
              echo "Deployed, but the address could not be read from the log."
              echo "Find it in the Cloudflare dashboard under Workers & Pages."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
